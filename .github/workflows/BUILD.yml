name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build release APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          cd "$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")"
          gradle assembleRelease --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"; exit ${PIPESTATUS[0]}
      - name: Show compile errors
        if: failure()
        run: |
          L="$GITHUB_WORKSPACE/build.log"
          { grep -E "^e: " "$L"; grep -A6 "What went wrong" "$L"; } | head -60 > errs.txt || true
          split -l 6 errs.txt part_
          for f in part_*; do msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}'); echo "::error::$msg"; done
      - uses: actions/upload-artifact@v4
        with:
          name: Clearplay-apk
          path: "**/app/build/outputs/apk/release/*.apk"
